<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ipc: http://ipc.localhost">
  <title>Pagbalatik</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="report.css">
</head>
<body data-theme="night">
  <script src="bridge.js"></script>
  <header class="titlebar">
    <img class="app-icon" src="icon.svg" alt="">
    <span class="name">Pagbalatik</span>
    <span class="beta" id="version">0.9 beta</span>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
  </header>
  <div class="frame">
    <nav class="rail" aria-label="Sections">
      <button type="button" class="rail-btn" data-go="chart" title="Chart"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M18.7 5.3l-2.8 2.8M8.1 15.9l-2.8 2.8"/></svg></button>
      <button type="button" class="rail-btn" data-go="library" title="Saved charts"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c3 .2 5 2.2 5 5.3"/></svg></button>
      <button type="button" class="rail-btn" data-go="report" title="Reports"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 2.8h8.5L19 7.3V21.2H6z"/><path d="M14.5 2.8v4.5H19"/><path d="M9 12h7M9 15h7M9 18h4.5"/></svg></button>
      <span class="rail-gap"></span>
      <button type="button" class="rail-btn" data-go="settings" title="Settings">⚙</button>
    </nav>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div id="print-root" aria-hidden="true"></div>
  <script src="chart-engine.js"></script>
  <script src="geo/tz-lookup.js"></script>
  <script src="geo/city-zone.js"></script>
  <script src="wheel.js"></script>
  <script src="report.js"></script>
  <script src="report-kit.js"></script>
  <script src="forecast.js"></script>
  <script src="synastry.js"></script>
  <script src="fortune.js"></script>
  <script src="themes.js"></script>
  <script src="business.js"></script>
  <script src="election.js"></script>
  <script src="docx-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
