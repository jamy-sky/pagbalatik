<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natal report mockup</title>
<style>
:root {
  --bg: #05070F; --bg-2: #0A0F1E; --panel: #121A33; --panel-2: #0E1529;
  --border: #2A3550; --border-strong: #3A4A7A;
  --text: #E8EEFF; --text-soft: #C9D4FF; --text-muted: #9FB0D8; --text-faint: #7A86A8;
  --accent: #E8B84A; --accent-soft: #F2D27A; --accent-wash: rgba(232,184,74,.12); --on-accent: #05070F;
  --f-ui: "Segoe UI", system-ui, sans-serif;
  --f-text: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --f-mono: "Cascadia Mono", Consolas, monospace;
  --f-sym: "Segoe UI Symbol", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #1b1d22; color: var(--text); font: 14px/1.45 var(--f-ui); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; }

.mock-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: #0d0e11; color: #c8ccd6; border-bottom: 1px solid #2a2d35; font-size: 13px; }
.mock-bar b { color: #fff; font-weight: 600; }
.mock-bar .grp { display: flex; gap: 4px; flex-wrap: wrap; }
.mock-bar button { padding: 4px 11px; border: 1px solid #343843; border-radius: 999px; color: #aab0bd; }
.mock-bar button.on { border-color: #E8B84A; color: #F2D27A; background: rgba(232,184,74,.1); }
.mock-bar select { background: #16181d; color: #c8ccd6; border: 1px solid #343843; border-radius: 6px; padding: 3px 8px; }
.mock-note { margin-left: auto; color: #7d8492; font-size: 12px; }
#main { flex: 1; min-height: 0; display: flex; }

/* ---------- app panels ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0,1fr); background: var(--bg-2); }
.side { min-height: 0; overflow: auto; border-right: 1px solid var(--border); background: var(--panel-2); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.side h2 { margin: 0; font: 600 18px var(--f-text); }
.side h3 { margin: 6px 0 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12px; color: var(--text-faint); }
.field input[type=text], .field select, .field textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; color: var(--text); font-size: 13px; }
.field textarea { resize: vertical; min-height: 50px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text-soft); }
.checks label small { display: block; color: var(--text-faint); font-size: 11.5px; }
.checks input, input[type=range] { accent-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text-soft); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
.btn:hover { color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.later { border: 1px dashed var(--border-strong); border-radius: 8px; padding: 10px 12px; color: var(--text-faint); font-size: 12.5px; }
.later b { color: var(--text-muted); }
.later ol { margin: 6px 0 0; padding-left: 18px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { padding: 5px 12px; font-size: 13px; color: var(--text-muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--panel); color: var(--accent-soft); }
.logo-drop { border: 1px dashed var(--border-strong); border-radius: 8px; padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--bg); }
.logo-drop .thumb { width: 64px; height: 64px; border-radius: 6px; background: #fbf8f1; display: grid; place-items: center; overflow: hidden; flex: none; }
.logo-drop .thumb img { max-width: 100%; max-height: 100%; }
.logo-drop .txt { font-size: 12px; color: var(--text-faint); }
.logo-drop .acts { display: flex; gap: 6px; margin-top: 6px; }
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc button { text-align: left; padding: 4px 8px; border-radius: 5px; font-size: 13px; color: var(--text-soft); display: flex; gap: 8px; }
.toc button:hover { background: var(--panel); }
.toc button span { color: var(--text-faint); font-family: var(--f-mono); font-size: 11px; width: 18px; }
.viewer { min-height: 0; overflow: auto; background: #2a2c31; padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.viewer.thumbs { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: flex-start; }
.viewer.thumbs .pwrap { width: calc(595px * .42); height: calc(842px * .42); overflow: hidden; cursor: pointer; }
.viewer.thumbs .paper { transform: scale(.42); transform-origin: top left; }
.vhead { align-self: stretch; display: flex; gap: 10px; align-items: center; color: #b8bdc8; font-size: 12px; }
.vhead .gen { margin-left: auto; display: flex; gap: 8px; }

/* ---------- paper ---------- */
.paper { --ink: #1d1a14; --ink-2: #4a4234; --ink-3: #8a7d62; --rule: #d9cfba; --pa: #8E2A1C; --wash: #f3ecdd;
  width: 595px; min-height: 842px; background: #fbf8f1; color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.4);
  padding: 40px 46px 36px; font: 10.5px/1.52 var(--f-text); position: relative; flex: none; }
.paper.clean { background: #fff; --pa: #23407F; --rule: #dde2ea; --wash: #f1f4f9; --ink-3: #6a7487; }
.paper .ph { display: flex; align-items: center; gap: 12px; border-bottom: 1.4px solid var(--pa); padding-bottom: 7px; margin-bottom: 12px; min-height: 34px; }
.paper .ph .logo { flex: none; display: flex; align-items: center; }
.paper .ph .logo img { display: block; }
.paper .ph .tt { flex: 1; }
.paper .ph h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--pa); line-height: 1.15; }
.paper .ph .sub { font: 9px var(--f-ui); color: var(--ink-2); text-align: right; line-height: 1.4; }
.paper h4 { font: 600 8.5px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--pa); margin: 12px 0 5px; }
.paper h5 { font-size: 12.5px; margin: 0 0 3px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
.paper h5 .gs { font-size: 15px; }
.paper p { margin: 0 0 5px; text-align: justify; hyphens: auto; }
.paper .src { font: italic 8.5px var(--f-ui); color: var(--ink-3); margin-top: 2px; }
.paper .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.paper table { width: 100%; border-collapse: collapse; font: 9.2px var(--f-ui); font-variant-numeric: tabular-nums; }
.paper td, .paper th { padding: 2.3px 3px; border-bottom: .5px solid var(--rule); text-align: left; vertical-align: top; }
.paper th { font-weight: 600; color: var(--ink-2); font-size: 7.8px; letter-spacing: .06em; text-transform: uppercase; }
.paper td.c, .paper th.c { text-align: center; }
.paper td.r, .paper th.r { text-align: right; }
.paper tr.tot td { font-weight: 600; border-top: 1px solid var(--ink-2); }
.paper tr.hi td { background: var(--wash); }
.paper .gs { font-family: var(--f-sym); font-style: normal; }
.paper .pos { color: #2f6b3e; } .paper .neg { color: #a3321f; }
.paper .pf { position: absolute; left: 46px; right: 46px; bottom: 16px; display: flex; justify-content: space-between; font: 8px var(--f-ui); color: var(--ink-3); border-top: .5px solid var(--rule); padding-top: 4px; }
.paper .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 6px; }
.paper .facts div { border: .5px solid var(--rule); border-radius: 3px; padding: 5px 7px; font: 8.5px var(--f-ui); color: var(--ink-2); background: #fffdf8; }
.paper.clean .facts div { background: #fff; }
.paper .facts b { display: block; font: 600 11.5px var(--f-text); color: var(--ink); }
.paper .box { border: .5px solid var(--rule); background: var(--wash); border-radius: 3px; padding: 6px 8px; margin: 4px 0 6px; font: 9px var(--f-ui); color: var(--ink-2); display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 10px; }
.paper .box b { color: var(--ink); font-weight: 600; }
.paper .planet { margin-bottom: 12px; break-inside: avoid; }
.paper .house { margin-bottom: 9px; }
.paper .house h5 { font-size: 11.5px; }
.paper .cover { display: flex; flex-direction: column; min-height: 756px; }
.paper .cover .brand { display: flex; align-items: center; gap: 12px; }
.paper .cover .brand .who { font: 9.5px/1.4 var(--f-ui); color: var(--ink-2); white-space: pre-line; }
.paper .cover .brand .who b { color: var(--ink); font-size: 11px; }
.paper .cover .mid { text-align: center; margin-top: 54px; }
.paper .cover .kicker { font: 600 9px var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); }
.paper .cover .t { font-size: 32px; color: var(--pa); margin: 8px 0 2px; }
.paper .cover .d { font: 10.5px var(--f-ui); color: var(--ink-2); }
.paper .cover .wheel-wrap svg { width: 360px; height: 360px; }
.paper .cover .note { margin-top: auto; font: 8.5px/1.5 var(--f-ui); color: var(--ink-3); border-top: .5px solid var(--rule); padding-top: 8px; }
.paper .wheel-wrap { display: flex; justify-content: center; margin: 6px 0; }
.paper .wheel-wrap.sm svg { width: 250px; height: 250px; }
.paper .tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0; }
.paper .tally div { text-align: center; border: .5px solid var(--rule); border-radius: 3px; padding: 6px; font: 8.5px var(--f-ui); color: var(--ink-2); }
.paper .tally b { display: block; font: 600 16px var(--f-text); color: var(--ink); }
.paper .tally .win { border-color: var(--pa); background: var(--wash); }
.paper .refs li { margin-bottom: 4px; }
.paper .refs { padding-left: 14px; margin: 0; font-size: 9.6px; }
.paper .act { font: 600 7.8px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border-radius: 2px; color: #fff; white-space: nowrap; }
.paper .act.magnify { background: #A8740E; } .paper .act.strengthen { background: #2f6b3e; } .paper .act.neutralize { background: #2C55B0; }
.paper .act.restrain { background: #B23A24; } .paper .act.settle { background: #5b4d36; } .paper .act.none { background: #b9ad94; }
.paper .rem { border: .5px solid var(--rule); border-radius: 4px; padding: 7px 10px 5px; margin-bottom: 8px; background: #fffdf8; }
.paper.clean .rem { background: #fff; }
.paper .rem h5 { justify-content: space-between; }
.paper .rem p { font-size: 9.6px; line-height: 1.42; margin-bottom: 3px; }
.paper .rem table td { padding: 1.6px 3px; }
.paper .rem .why { margin: 0 0 4px; padding-left: 13px; font: 8.6px/1.4 var(--f-ui); color: var(--ink-2); }
.paper .rem .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; }
.paper .rem .lbl { font: 600 7.8px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--pa); margin: 4px 0 2px; }
.paper .rem table td:first-child { color: var(--ink-3); width: 58px; }
.paper .days { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
.paper .days span { font: 8.5px var(--f-ui); border: .5px solid var(--rule); border-radius: 10px; padding: 0 6px; background: var(--wash); }
.paper .future { border-top: .5px dashed var(--ink-3); padding-top: 2px; font: italic 8.3px var(--f-ui); color: var(--ink-3); margin-top: 2px; }
.paper .defs { display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; font: 9.2px/1.45 var(--f-ui); color: var(--ink-2); margin: 4px 0 8px; align-items: baseline; }
.paper .tag { font: 600 7.5px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; padding: 0 4px; border-radius: 2px; margin-left: 4px; vertical-align: 1px; }
.paper .tag.pd { background: #dcebdc; color: #2f5f37; } .paper .tag.cc0 { background: #d9e6f5; color: #23407F; } .paper .tag.chk { background: #f5e8c8; color: #7a5a12; } .paper .tag.ref { background: #eee; color: #666; }
/* wheel colours on paper */
.paper .wheel text { text-anchor: middle; dominant-baseline: central; font-family: var(--f-sym); }
.paper .wheel .ring { fill: none; stroke: #a99a78; stroke-width: 1.2; }
.paper .wheel .ring.faint { stroke: #cfc3a8; stroke-dasharray: 3 4; }
.paper .wheel .sign-line, .paper .wheel .cusp { stroke: #a99a78; stroke-width: 1; }
.paper .wheel .deg-tick { stroke: #cfc3a8; stroke-width: 1; }
.paper .wheel .cusp.angle { stroke: #6b5f48; stroke-width: 1.6; }
.paper .wheel .sign { font-size: 24px; }
.paper .wheel .house-num { font-size: 15px; fill: #8a7d62; font-style: italic; font-family: var(--f-text); }
.paper .wheel .angle-label { font-size: 15px; fill: #3b3020; font-family: var(--f-ui); }
.paper .wheel .glyph { font-size: 25px; }
.paper .wheel .deg { font-size: 12px; fill: #8a7d62; font-family: var(--f-ui); }
.paper .wheel .tick-body { stroke: #6b5f48; stroke-width: 1.4; }
.paper .wheel .asp { stroke-width: 1.6; }
.paper .el-fire { fill: #B8402C; color: #B8402C; } .paper .el-earth { fill: #8A5A22; color: #8A5A22; } .paper .el-air { fill: #2F6FA3; color: #2F6FA3; } .paper .el-water { fill: #24805A; color: #24805A; }
.paper .asp-trine { stroke: #2C55B0; } .paper .asp-sextile { stroke: #237A52; } .paper .asp-square { stroke: #B23A24; } .paper .asp-opposition { stroke: #B85A1C; stroke-dasharray: 6 4; }
.paper .sun { fill: #A8740E; color: #A8740E; } .paper .moon { fill: #6E6A5C; color: #6E6A5C; } .paper .mercury { fill: #2E8A78; color: #2E8A78; } .paper .venus { fill: #B5487A; color: #B5487A; }
.paper .mars { fill: #B8402C; color: #B8402C; } .paper .jupiter { fill: #4B4BB0; color: #4B4BB0; } .paper .saturn { fill: #7A6630; color: #7A6630; } .paper .uranus { fill: #237F94; color: #237F94; }
.paper .neptune { fill: #2F62A8; color: #2F62A8; } .paper .pluto { fill: #7A4A9C; color: #7A4A9C; } .paper .node, .paper .snode { fill: #6b5f48; color: #6b5f48; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; overflow: auto; }
  .side { overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
  .viewer { overflow: visible; padding: 12px 0; }
  .viewer:not(.thumbs) .pwrap { width: calc(595px * .6); height: calc(842px * .6); overflow: hidden; }
  .viewer:not(.thumbs) .paper { transform: scale(.6); transform-origin: top left; }
  .mock-note { display: none; }
}
</style>
</head>
<body>
<div class="mock-bar">
  <b>Natal reading · mockup</b>
  <div class="grp" id="mk-screens">
    <button data-s="report" class="on">1 · The report</button>
    <button data-s="builder">2 · Report options</button>
    <button data-s="settings">3 · Settings · Logo</button>
  </div>
  <label>Chart <select id="mk-person"></select></label>
  <span class="mock-note">Every table and paragraph is computed from the chart. The wording is a draft for review.</span>
</div>
<div id="main"></div>

<script>/* chart-engine.js from FEMT PC 0.6.3, inlined */
// FEMT chart engine: tropical positions of the Sun, Moon, planets and lunar node, the angles,
// house cusps and aspects for a moment and place. Pure functions; scripts/test-chart.js checks them.
//
// Planets use the same Keplerian elements as the phone app (E. M. Standish, JPL, valid 1800–2050:
// errors of arcminutes). The Moon uses the main periodic terms of Meeus, Astronomical Algorithms
// ch. 47 (good to about 0.01°), since a chart shows the Moon to the degree.
(function (root) {
  const DEG = Math.PI / 180;
  const J2000 = 2451545.0;
  const PRECESSION = 1.396971; // general precession in longitude, degrees per century
  const norm = (d) => ((d % 360) + 360) % 360;
  const sin = (d) => Math.sin(d * DEG), cos = (d) => Math.cos(d * DEG);
  const julianDay = (ms) => ms / 86400000 + 2440587.5;
  const centuries = (jd) => (jd - J2000) / 36525;
  const obliquity = (T) => 23.439291 - 0.0130042 * T;

  // ---------- planets (Standish Table 1: a, e, I, L, long. perihelion, node; and rates per century)
  const EL = {
    earth: [[1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0], [0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0]],
    mercury: [[0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593], [0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081]],
    venus: [[0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255], [0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418]],
    mars: [[1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891], [0.00001847, 0.00007882, -0.00813131, 19140.30268499, 0.44441088, -0.29257343]],
    jupiter: [[5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909], [-0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106]],
    saturn: [[9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448], [-0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794]],
    uranus: [[19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503], [-0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589]],
    neptune: [[30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574], [0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664]],
    pluto: [[39.48211675, 0.24882730, 17.14001206, 238.92903833, 224.06891629, 110.30393684], [-0.00031596, 0.00005170, 0.00004818, 145.20780515, -0.04062942, -0.01183482]],
  };

  function helio(name, T) {
    const [base, rate] = EL[name];
    const v = base.map((b, i) => b + rate[i] * T);
    const [a, e] = v;
    const inc = v[2] * DEG, node = v[5] * DEG, peri = (v[4] - v[5]) * DEG;
    let M = norm(v[3] - v[4]);
    if (M > 180) M -= 360;
    const m = M * DEG;
    let E = m + e * Math.sin(m);
    for (let i = 0; i < 30; i++) {
      const d = (E - e * Math.sin(E) - m) / (1 - e * Math.cos(E));
      E -= d;
      if (Math.abs(d) < 1e-12) break;
    }
    const xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
    const cw = Math.cos(peri), sw = Math.sin(peri), cn = Math.cos(node), sn = Math.sin(node), ci = Math.cos(inc), si = Math.sin(inc);
    return [
      (cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp,
      (cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp,
      (sw * si) * xp + (cw * si) * yp,
    ];
  }

  /** Geocentric ecliptic longitude and latitude, equinox of date, degrees. */
  function planetLonLat(name, T) {
    const earth = helio('earth', T);
    const p = name === 'sun' ? [0, 0, 0] : helio(name, T);
    const x = p[0] - earth[0], y = p[1] - earth[1], z = p[2] - earth[2];
    return { lon: norm(Math.atan2(y, x) / DEG + PRECESSION * T), lat: Math.atan2(z, Math.hypot(x, y)) / DEG };
  }

  // ---------- Moon (Meeus ch. 47, main terms; coefficients in degrees)
  const MOON_LON = [
    // D, M, M', F, coefficient
    [0, 0, 1, 0, 6.288774], [2, 0, -1, 0, 1.274027], [2, 0, 0, 0, 0.658314], [0, 0, 2, 0, 0.213618],
    [0, 1, 0, 0, -0.185116], [0, 0, 0, 2, -0.114332], [2, 0, -2, 0, 0.058793], [2, -1, -1, 0, 0.057066],
    [2, 0, 1, 0, 0.053322], [2, -1, 0, 0, 0.045758], [0, 1, -1, 0, -0.040923], [1, 0, 0, 0, -0.034720],
    [0, 1, 1, 0, -0.030383], [2, 0, 0, -2, 0.015327], [0, 0, 1, 2, -0.012528], [0, 0, 1, -2, 0.010980],

    for (const sg of E.SIGNS) { const [x1, y1] = pos(sg.start, R.z0), [x2, y2] = pos(sg.start, R.z1), [gx, gy] = pos(sg.start + 15, (R.z0 + R.z1) / 2);

    for (let d = 0; d < 360; d += 5) { const len = d % 10 === 0 ? 9 : 6; const [x1, y1] = pos(d, R.z0), [x2, y2] = pos(d, R.z0 + len); s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="deg-tick"/>`; }

      const [nx, ny] = pos(c + E.norm(cs[(i + 1) % 12] - c) / 2, (R.h0 + R.asp) / 2); s += `<text x="${nx}" y="${ny}" class="house-num">${i + 1}</text>`; });

    moon: { ch: 'I.24', metal: 'Silver', colour: 'White and green', stones: 'Selenite, pearl, crystal', square: '9 × 9 (sum 369)' },
    mercury: { ch: 'I.29', metal: 'Quicksilver', colour: 'Mixed, yellow with green', stones: 'Emerald, agate, topaz', square: '8 × 8 (sum 260)' },
    venus: { ch: 'I.28', metal: 'Brass, yellow and red; silver', colour: 'Fair, white and green', stones: 'Beryl, coral, carnelian', square: '7 × 7 (sum 175)' },
    mars: { ch: 'I.27', metal: 'Iron, red brass', colour: 'Red, fiery, the colour of iron', stones: 'Bloodstone, jasper, amethyst', square: '5 × 5 (sum 65)' },
    jupiter: { ch: 'I.26', metal: 'Tin', colour: 'Sapphire and airy colours, evergreen', stones: 'Hyacinth, sapphire, beryl', square: '4 × 4 (sum 34)' },
    saturn: { ch: 'I.25', metal: 'Lead', colour: 'Black, leaden, brown, earthy', stones: 'Onyx, chalcedony, lodestone', square: '3 × 3 (sum 15)' } };
  // Culpeper, The Complete Herbal (1653), Project Gutenberg #49513: every herb checked against its "Government and virtues".
  const CULPEPER = { sun: 'angelica, eyebright, St John\'s wort, rosemary, marigold', moon: 'chickweed, cleavers, purslane, watercress, willow',
    mercury: 'fennel, dill, lavender, sweet marjoram, parsley', venus: 'thyme, violet, mint, damask rose, yarrow', mars: 'basil, garlic, nettle, wormwood, mustard',
    jupiter: 'borage, wood betony, sage, hyssop, balm', saturn: 'mullein, horsetail, shepherd\'s purse, Solomon\'s seal, comfrey' };
  // Culpeper, "To the Reader", Instructions for the right use of the book, 4th: "diseases of Jupiter by herbs of Mercury, and the contrary;
  // diseases of the Luminaries by the herbs of Saturn, and the contrary; diseases of Mars by herbs of Venus, and the contrary."
  const ANTIPATHY = { jupiter: 'mercury', mercury: 'jupiter', sun: 'saturn', moon: 'saturn', saturn: 'sun', mars: 'venus', venus: 'mars' };
  // Ficino, De vita libri tres, Book III (De vita coelitus comparanda, 1489), paraphrased and checked against the
  // Source Library transcription of the 1489 Florence edition. Chapters: III.5 (the three Graces), III.11 (spirit, colours,
  // flavours, scents), III.18 (the three colours), III.21 (song), III.22 (Saturn, and Jupiter's defence against him).
  const FICINO = {
    sun: { draw: 'Spend the daylight hours under the open sky, in high, clear and temperate places, and keep about you the burning, saffron, golden and clear purple colours, and saffron, cloves, musk and amber among scents (III.11). The Sun is one of Ficino\'s three Graces, with Jupiter and Venus (III.5). Use solar things with care: too much of them, he warns, sharpens and dries the spirit, so mix in Jovial things (III.11).',
      short: 'daylight under the open sky, and the golden, saffron and clear purple colours (III.11)' },
    moon: { draw: 'Keep about you the watery, white and green colours and the scents of violets, roses and lilies, which Ficino gives to the Moon with Venus and Mercury (III.11, III.18). Above all, act when the Moon joins Jupiter or Venus: she carries the gifts of the three Graces to us, and is most fortunate in conjunction with them (III.5).',
      short: 'the Moon joined to Jupiter or Venus, the messenger of the Graces (III.5)' },
    mercury: { draw: 'Mercury governs the spirit that serves sense and imagination, and by his condition sharpens or dulls the mind (III.11). Work with him through songs of the middle kinds, which Ficino gives to Mercury and the Sun (III.21), and through the colours and scents he shares with Venus and the Moon; but mix Jovial things with his, since Mercurial things alone, Ficino says, profit little (III.11).',
      short: 'songs of the middle kinds, which Ficino gives to Mercury and the Sun (III.21)' },
    venus: { draw: 'Surround yourself with the colours of violets, roses and lilies (white, green, soft saffron) and with their scents (III.11); green is Venus\'s own colour (III.18). Pleasure itself, Ficino says, is how Venus enters the spirit (III.11), and her songs are soft and voluptuous (III.21). Hold her together with Jupiter: devoted to Venus alone, he warns, we do not easily keep the Sun (III.5).',
      short: 'the colours and scents of violets, roses and lilies, and gentle pleasure (III.11)' },
    jupiter: { draw: 'Use Jovial things as much as you can: Jupiter is the most tempered of the three Graces and the most congruent with human nature (III.5, III.11). His songs are grave yet intense, sweet, and joyful with constancy (III.21); his colours sapphire and airy, fuller purple, gold mixed with silver, and evergreen; his flavours the golden peach, pear and orange, and light wines (III.11). He is the helping father of those who live a common life among others (III.22).',
      short: 'Jovial songs, grave yet sweet and joyful with constancy, and sapphire and airy colours (III.11, III.21)' },

      temper: 'Ficino\'s remedy for Saturn is to flee to Jupiter, who defends us from him, or to give the whole mind to divine contemplation. Keep Saturday for contemplation rather than civil or military business, and avoid slow, heavy, raucous and mournful songs, which are his (III.21–22).' },

      temper: 'Avoid fast, high, harsh and threatening songs, which are Mars\'s (III.21), and the vehement passions of the imagination that he governs; Ficino counts excessive Martial things as poisons to the spirit (III.11).' } };
  const wayOfLife = (r) => r.via === r.id ? FICINO[r.id].draw
    : `${FICINO[r.id].temper ? `${FICINO[r.id].temper} ` : ''}${FICINO[r.id].temper ? 'Draw instead on' : `Counter ${NA(r.id)} by drawing on`} ${NA(r.via)}: ${FICINO[r.via].short}.`;
  const ACT_DEF = { magnify: 'make more of a strong planet that helps the chart', strengthen: 'support a planet the chart needs that is weak in itself',
    neutralize: 'counter a weak planet that strikes at the chart, through its opposite', restrain: 'keep Mars in check, always, as in FEMT', settle: 'calm Saturn and give it a purpose, always, as in FEMT' };
  const homes = (id) => E.SIGNS.filter((s) => RULER[s.name] === id).map((s) => s.name).concat(EXALT[id] ? [`${EXALT[id]} (exaltation)`] : []);

  function remedies(A) {
    const counter = A.P.jupiter.total >= A.P.venus.total ? 'jupiter' : 'venus';
    return T7.map((id) => {
      const X = A.P[id], why = [];
      const roles = [A.ascLord === id ? 'lord of the Ascendant' : null, A.lordOf(10) === id ? 'lord of the 10th' : null, RULER[signName(A.fortune)] === id ? 'lord of the Lot of Fortune' : null, id === 'sun' || id === 'moon' ? 'a light of the chart' : null].filter(Boolean);
      const bad = X.es.list.filter(([n]) => ['Detriment', 'Fall', 'Peregrine'].includes(n)).map(([n]) => n.toLowerCase())
        .concat(X.ac.list.filter(([n, v]) => v <= -4).map(([n]) => n.toLowerCase()));
      const good = X.es.list.filter(([n, v]) => v >= 3).map(([n]) => n.toLowerCase()).concat(X.ac.list.filter(([n, v]) => v >= 4 && !/Free|Direct/.test(n)).map(([n]) => n));
      const strikes = A.ch.aspects.filter((a) => (a.a === id || a.b === id) && ASP[a.aspect].kind === 'hard' && a.orb < 6)
        .map((a) => a.a === id ? a.b : a.a).filter((o) => T7.includes(o) && (o === A.ascLord || o === 'sun' || o === 'moon' || o === A.lordOf(10)) && o !== id);
      let act = 'none', pri = 0;
      if (id === 'mars' || id === 'saturn') {
        act = id === 'mars' ? 'restrain' : 'settle';
        pri = id === A.contraryMalefic ? 3 : X.total < 0 ? 2 : 1;
        why.push(id === A.contraryMalefic ? `${N(id)} is the malefic contrary to the sect, the more harmful of the two` : `${N(id)} is the malefic of the sect, so its harm is milder`);
      } else if (X.total < 0 && strikes.length) { act = 'neutralize'; pri = 3; why.push(`It is weak and strikes at ${strikes.map(NA).join(' and ')} by hard aspect`); }
      else if (X.total < 0) { act = 'strengthen'; pri = roles.length ? 2 : 1; }
      else if (X.total >= 10 && (['jupiter', 'venus'].includes(id) || roles.length)) { act = 'magnify'; pri = roles.length ? 2 : 1; }
      else if (roles.length && X.total < 4) { act = 'strengthen'; pri = 1; }
      if (act === 'none') why.push(`Sound enough as it is (${grade(X.total)})`);
      if (act === 'magnify' && good.length) why.push(`Strengths: ${good.join(', ')}`);
      if (roles.length) why.push(`It is ${roles.join(' and ')}`);
      if (bad.length) why.push(`Debilities: ${bad.join(', ')}`);
      if (good.length && (act === 'restrain' || act === 'settle')) why.push(`Strengths: ${good.join(', ')}`);
      why.push(`Total strength ${X.total > 0 ? '+' : ''}${X.total}: ${grade(X.total)}`);
      const via = act === 'neutralize' || act === 'restrain' || act === 'settle' ? (id === 'saturn' ? 'jupiter' /* Ficino III.22: Jupiter defends us from Saturn */ : id === 'mars' ? 'venus' : counter) : id;
      return { id, act, pri, why, via, herbs: act === 'none' ? null : ['magnify', 'strengthen'].includes(act) ? id : ANTIPATHY[id] };
    }).sort((a, b) => b.pri - a.pri || A.P[a.id].total - A.P[b.id].total);
  }
  /** The next few days, in the native's zone, that suit an action: the right weekday, with the Moon well placed. */
  function nextDays(A, r) {
    const day = DAYNUM[r.via], target = signIdx(A.B[r.via].lon), avoid = signIdx(A.B[r.id].lon), out = [];
    const now = E.utcToZoned(Date.now(), A.p.tz);
    for (let i = 1; i <= 70 && out.length < 4; i++) {
      const t = new Date(Date.UTC(now.y, now.m - 1, now.d + i));
      if (t.getUTCDay() !== day) continue;
      const ms = E.zonedToUtc(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate(), 12, 0, A.p.tz);
      const m = signIdx(E.chart(ms, A.p.place.lat, A.p.place.lon).bodies[1].lon);
      const toT = (m - target + 12) % 12, toA = (m - avoid + 12) % 12;
      if (![0, 2, 4, 8, 10].includes(toT)) continue;
      if (r.via !== r.id && [3, 6, 9].includes(toA)) continue;
      out.push(`${WEEKDAY[t.getUTCDay()].slice(0, 3)} ${t.getUTCDate()} ${MONTHS[t.getUTCMonth()]}`);
    }
    return out;
  }
  function timingText(A, r) {

    if (r.via === r.id && r.id === 'sun') return `${mat}, in his own hours, with the Moon in a sign that sees the Sun's natal sign by sextile or trine. The best elections come when the Sun is in ${homes('sun').join(' or ')} and angular.`;
    if (r.via === r.id) return `${mat}, in its own hours, with the Moon in a sign that sees ${NA(r.id)}'s sign by sextile or trine. The best elections come when ${NA(r.id)} is direct, out of the Sun's beams, and in ${homes(r.id).join(' or ')}.`;

        ${T7.map((id) => { const { ac } = A.P[id]; const f = (keys) => { const x = ac.list.find(([n]) => keys.some((k) => n.includes(k))); return x ? `${x[0].replace(/^\d+\w+ house$/, (m) => m)} <span class="${x[1] >= 0 ? 'pos' : 'neg'}">${x[1] > 0 ? '+' : ''}${x[1]}</span>` : '—'; };
          return `<tr><td class="c">${G(id)}</td><td>${N(id)}</td><td>${f(['house'])}</td><td>${f(['Direct', 'Retrograde'])}</td><td>${f(['Swift', 'Slow'])}</td><td>${f(['Cazimi', 'Combust', 'beams', 'Free'])}</td><td>${f(['Oriental', 'Occidental', 'light'])}</td><td class="r ${ac.score >= 0 ? 'pos' : 'neg'}">${ac.score > 0 ? '+' : ''}${ac.score}</td></tr>`; }).join('')}

        ${A.ranked.map((id, i) => `<tr class="${i === 0 ? 'hi' : ''}"><td>${i + 1}</td><td class="c">${G(id)}</td><td>${N(id)}</td><td class="r">${A.P[id].es.score}</td><td class="r">${A.P[id].ac.score}</td><td class="r"><b>${A.P[id].total > 0 ? '+' : ''}${A.P[id].total}</b></td><td>${cap(grade(A.P[id].total))}</td></tr>`).join('')}

    if (S.sec.temperament) page('temperament', 'Temperament and the quality of the soul', () => { const T = temperament(A); const m = A.B.mercury, mo = A.B.moon;
      const mMode = MODE[signIdx(m.lon) % 3], moMode = MODE[signIdx(mo.lon) % 3];
      return `${head('Temperament and the quality of the soul')}
      <h4>Temperament</h4><p>The old authors judged the temperament, the balance of hot, cold, moist and dry in the constitution, by taking testimonies from the Ascendant and its lord, the Moon and her phase, the season of the Sun, and any planet rising. Each testimony is counted below.</p>
      <table><thead><tr><th>Testimony</th><th class="c">Hot</th><th class="c">Cold</th><th class="c">Moist</th><th class="c">Dry</th></tr></thead><tbody>

        <tr class="tot"><td>Total</td>${['hot', 'cold', 'moist', 'dry'].map((k) => `<td class="c">${T.n[k]}</td>`).join('')}</tr></tbody></table>
      <div class="tally">${['Sanguine', 'Choleric', 'Melancholic', 'Phlegmatic'].map((k) => `<div class="${k === T.name ? 'win' : ''}"><b>${k === T.name ? '●' : '○'}</b>${k}</div>`).join('')}</div>
      <p>The testimonies lean ${T.a} and ${T.b}, so the temperament is <b>${T.name.toLowerCase()}</b>: ${TEMP_TXT[T.name]} ${T.n.hot === T.n.cold || T.n.moist === T.n.dry ? 'The count is close, so the temperament is mixed, and the second quality should be read alongside the first.' : ''}</p>
      <h4>The quality of the soul</h4>
      <p>Ptolemy takes the quality of the soul from Mercury, for the reasoning part, and from the Moon, for the feeling and instinctive part, judged by their signs and by the planets that rule and aspect them.</p>
      <h5>${G('mercury')} The mind: Mercury in ${m.sign.name}</h5>
      <p>Mercury in ${an(m.sign.element)} sign makes the mind ${ELEM_MIND[m.sign.element]}; in ${an(mMode)} sign it is ${MODE_MIND[mMode]}. ${RULER[m.sign.name] === 'mercury' ? 'Mercury rules its own sign here, which gives the mind independence' : `Its ruler is ${NA(RULER[m.sign.name])}`}${RULER[m.sign.name] === 'mercury' ? '' : `, which lends Mercury something of its nature: ${NATURE[RULER[m.sign.name]].split(':')[1].split('.')[0].trim()}`}. Mercury is ${grade(A.P.mercury.total)}${A.P.mercury.ac.list.some(([n]) => n === 'Combust') ? ', and combust, so the thinking is apt to be hidden, private or overshadowed by the will' : ''}.</p>
      <h5>${G('moon')} The feelings: Moon in ${mo.sign.name}</h5>
      <p>The Moon in ${an(mo.sign.element)} sign makes the feelings ${ELEM_MIND[mo.sign.element]}; in ${an(moMode)} sign they are ${MODE_MIND[moMode]}. She is ruled by ${N(RULER[mo.sign.name])} and is ${grade(A.P.moon.total)}. ${A.ch.aspects.filter((a) => (a.a === 'moon' || a.b === 'moon') && T7.includes(a.a) && T7.includes(a.b)).slice(0, 2).map((a) => { const o = a.a === 'moon' ? a.b : a.a; return `Her ${ASP[a.aspect].name.toLowerCase()} with ${N(o)} brings in ${['jupiter', 'venus'].includes(o) ? 'warmth and ease' : ['saturn'].includes(o) ? 'caution and reserve' : o === 'mars' ? 'heat and impatience' : o === 'mercury' ? 'thought and talk' : 'vitality and pride'}.`; }).join(' ')}</p>
      <h5>Mercury and the Moon together</h5>
      <p>${E.separation(m.lon, mo.lon) < 60 || A.ch.aspects.some((a) => (a.a === 'mercury' && a.b === 'moon') || (a.a === 'moon' && a.b === 'mercury')) ? 'They are in aspect, so mind and feeling work together, and what is felt is soon put into words.' : 'They are not in aspect, so mind and feeling keep separate counsel: the head may decide one way while the heart goes another.'}</p>
      ${cite('Temperament: Lilly, Christian Astrology III (the temperature of the native); Gadbury, Genethlialogia. Quality of the soul: Ptolemy, Tetrabiblos III, "Of the quality of the soul".')}`; });

    if (S.sec.planets) {
      const chunks = [['sun', 'moon'], ['mercury', 'venus'], ['mars', 'jupiter'], ['saturn']];
      chunks.forEach((ids, ci) => page(`planets${ci}`, ci === 0 ? 'The seven planets' : `The seven planets (${ci + 1})`, () => `${head(ci === 0 ? 'The seven planets' : 'The seven planets, continued')}
        ${ci === 0 ? '<p>Each planet is read by its nature, its condition (sign and dignity), its place (house), the houses it rules and the planets it meets. The condition decides how well it can deliver what it signifies.</p>' : ''}
        ${ids.map((id) => { const X = A.P[id]; return `<div class="planet"><h5>${G(id)} ${N(id)} in ${X.b.sign.name}, ${ord(X.b.house)} house</h5>
          <div class="box"><span>Position <b>${fmtLon(X.b.lon)}${X.b.retrograde ? ' ℞' : ''}</b></span><span>Dignity <b>${X.es.state}</b> (${X.es.score > 0 ? '+' : ''}${X.es.score})</span><span>Accidental <b>${X.ac.score > 0 ? '+' : ''}${X.ac.score}</b></span>
          <span>Rules <b>${A.rules(id).map(ord).join(', ') || '—'}</b></span><span>Dispositor <b>${N(RULER[X.b.sign.name])}</b></span><span>Total <b>${X.total > 0 ? '+' : ''}${X.total}</b></span></div>
          ${planetReading(A, id).map((t) => `<p>${t}</p>`).join('')}</div>`; }).join('')}
        ${ci === chunks.length - 1 && S.modern === 'listed' ? `<h4>Uranus, Neptune and Pluto</h4><p>The modern planets were unknown to the traditional authors and are not judged here. For reference: ${['uranus', 'neptune', 'pluto'].map((id) => `${N(id)} ${fmtLon(A.B[id].lon)} in the ${ord(A.B[id].house)}`).join('; ')}.</p>` : ''}
        ${cite('Natures of the planets: Ptolemy, Tetrabiblos I; Lilly, Christian Astrology I. Dignity and debility: Lilly I. Houses and their lords: Valens, Anthology II; Lilly III; Ramesey, Astrologia Restaurata.')}`));
    }

    if (S.sec.houses) [[1, 6], [7, 12]].forEach(([a, z], k) => page(`houses${k}`, k ? 'The houses (2)' : 'The twelve houses', () => `${head(k ? 'The twelve houses, continued' : 'The twelve houses')}
      ${k ? '' : '<p>Each house is judged by the sign on its cusp, the condition and place of its lord, and any planet in it. Benefics in a house, or a strong lord, promise good in its matters; malefics, or a weak and badly placed lord, promise difficulty.</p>'}
      ${[...Array(z - a + 1).keys()].map((i) => { const h = a + i; return `<div class="house"><h5>${h}. ${HOUSE_NAME[h]} <span class="src" style="font-style:normal">${fmtLon(A.cusps[h - 1])} · lord ${G(A.lordOf(h))}</span></h5>${houseReading(A, h).map((t) => `<p>${t}</p>`).join('')}</div>`; }).join('')}
      ${cite('Lilly, Christian Astrology III, the judgment of each house in a nativity; Ptolemy, Tetrabiblos IV (material fortune, profession, marriage, children, friends, travel); Firmicus Maternus, Mathesis III.')}`));

    if (S.sec.lots) page('lots', 'Lots and fixed stars', () => { const yrs = (p.ms / 864e5 / 365.2425) + 1970 - 2000; const hits = [];
      const pts = T7.map((id) => [NA(id), A.B[id].lon]).concat([['the Ascendant', ch.angles.asc], ['the Midheaven', ch.angles.mc]]);
      for (const [st, l0, nat] of STARS) { const l = E.norm(l0 + yrs * 0.013969); for (const [pn, pl] of pts) { const d = E.separation(l, pl); if (d <= 1.5) hits.push({ st, l, nat, pn, d }); } }
      const lot = (name, lon, txt) => { const lord = RULER[signName(lon)], h = A.houseOf(lon); return `<h5>${name} ${fmtLon(lon)}, ${ord(h)} house</h5><p>${txt} It falls in the ${ord(h)}, of ${HOUSE[h]}, and its lord ${N(lord)} is in the ${ord(A.B[lord].house)}, ${grade(A.P[lord].total)}. ${[6, 8, 12].includes(h) ? 'Falling in a troubled house, it shows fortune won through difficulty.' : angularity(h) === 'angular' ? 'Being angular, it is active and evident in the life.' : ''}</p>`; };
      return `${head('Lots and fixed stars')}
      <h4>The Lots</h4><p>A lot is a point found by measuring the distance between two planets and projecting it from the Ascendant. ${A.day ? 'By day' : 'By night'} the Lot of Fortune is taken from the ${A.day ? 'Sun to the Moon' : 'Moon to the Sun'}, and the Lot of Spirit the reverse.</p>
      ${lot('Lot of Fortune', A.fortune, 'Fortune signifies the body, material circumstances and what comes to the native by chance.')}
      ${lot('Lot of Spirit', A.spirit, 'Spirit signifies the mind, intentions and what the native does by choice: action, profession and reputation.')}
      <h4>Fixed stars</h4><p>The bright stars within 1½° of a planet or angle, with their natures as Ptolemy gives them in terms of the planets.</p>
      ${hits.length ? `<table><thead><tr><th>Star</th><th class="r">Position</th><th>Nature</th><th>With</th><th class="r">Orb</th></tr></thead><tbody>${hits.map((h) => `<tr><td>${h.st}</td><td class="r">${fmtLon(h.l)}</td><td>${h.nat}</td><td>${h.pn}</td><td class="r">${h.d.toFixed(1)}°</td></tr>`).join('')}</tbody></table>
      ${hits.map((h) => `<p><b>${h.st} with ${h.pn}.</b> A star of the nature of ${h.nat.replace('–', ' and ')}, joined to the ${h.pn === 'the Ascendant' || h.pn === 'the Midheaven' ? 'angle' : 'planet'}, adds that colouring to it: ${/Jupiter|Venus/.test(h.nat) && !/Mars|Saturn/.test(h.nat) ? 'a fortunate one' : /Mars|Saturn/.test(h.nat) && !/Jupiter|Venus/.test(h.nat) ? 'a sharp or testing one' : !/Mars|Saturn|Jupiter|Venus/.test(h.nat) ? 'a changeable one, taking the colour of what it touches' : 'mixed, with honour and danger together'}.</p>`).join('')}` : '<p>No bright star is within orb of a planet or angle.</p>'}
      ${cite('Lots: Valens, Anthology II; Ptolemy, Tetrabiblos III (the Lot of Fortune). Stars and their natures: Ptolemy, Tetrabiblos I, "Of the power of the fixed stars". Positions: approximate here; the app will use the Yale Bright Star Catalogue (public domain).')}`; });

    if (S.sec.timing) page('timing', 'Timing: profections and firdaria', () => { const pr = profections(A), F = firdaria(A); const cur = F.rows.find((r) => r.now);
      return `${head('Timing: profections and firdaria')}
      <p>Two of the oldest timing methods divide the life into periods, each ruled by a planet. That planet's condition in the birth chart colours the period.</p>
      <h4>Annual profections</h4><p>The Ascendant moves forward one sign for each year of life. The sign it reaches is the year's house, and its ruler is the Lord of the Year (the same Lord of the Year that FEMT's Celestial Alignment uses).</p>
      <table><thead><tr><th>Age</th><th>Year</th><th>House</th><th>Sign</th><th>Lord of the Year</th><th>Natal condition</th></tr></thead><tbody>
        ${pr.map((r) => `<tr class="${r.now ? 'hi' : ''}"><td>${r.a}${r.now ? ' (now)' : ''}</td><td>${r.years}</td><td>${ord(r.house)}: ${HOUSE_SHORT[r.house]}</td><td><i class="gs ${ELC[r.sg.element]}">${r.sg.glyph}</i> ${r.sg.name}</td><td>${G(r.lord)} ${N(r.lord)}</td><td>${cap(grade(r.total))}</td></tr>`).join('')}
      </tbody></table>
      ${(() => { const r = pr.find((x) => x.now); return `<p>This year the profection reaches the ${ord(r.house)} house, bringing ${HOUSE[r.house]} to the fore. ${N(r.lord)}, ${grade(r.total)} in the birth chart and placed in the ${ord(A.B[r.lord].house)}, rules the year: watch its transits, and the matters of the ${ord(A.B[r.lord].house)} house.</p>`; })()}
      <h4>Firdaria</h4><p>The life is divided into planetary periods in a fixed order, which ${A.day ? 'by day begins with the Sun' : 'by night begins with the Moon'}. Each planet's period is divided into seven sub-periods.</p>
      <div class="two"><table><thead><tr><th>Period</th><th>Ages</th><th>From</th></tr></thead><tbody>
        ${F.rows.map((r) => `<tr class="${r.now ? 'hi' : ''}"><td>${G(r.id)} ${N(r.id)}</td><td>${r.from.toFixed(0)}–${r.to.toFixed(0)}</td><td>${yrm(A, r.from)}</td></tr>`).join('')}</tbody></table>
      <div>${cur && cur.subs.length ? `<table><thead><tr><th colspan="2">${N(cur.id)} period: sub-periods</th><th>From</th></tr></thead><tbody>${cur.subs.map((s) => `<tr class="${F.age >= s.from && F.age < s.to ? 'hi' : ''}"><td>${G(cur.id)}/${G(s.id)}</td><td>${N(s.id)}</td><td>${yrm(A, s.from)}</td></tr>`).join('')}</tbody></table>
        <p style="margin-top:6px">Now in the period of ${N(cur.id)} (${grade(A.P[cur.id].total)}), sub-period of ${N(cur.subs.find((s) => F.age >= s.from && F.age < s.to).id)}.</p>` : '<p>The current period is a node period, which has no sub-periods.</p>'}</div></div>
      ${cite('Profections: Valens, Anthology IV; Ptolemy, Tetrabiblos IV, "Of the division of times". Firdaria: Abu Ma\'shar, in Bonatti, Liber Astronomiae (Latin, 1491); order of the nodes after Bonatti.')}`; });

    if (S.sec.remedies) {
      const R = remedies(A), acting = R.filter((r) => r.act !== 'none');
      const card = (r) => { const ag = AGRIPPA[r.via], days = nextDays(A, r);
        return `<div class="rem"><h5><span>${G(r.id)} ${N(r.id)} <span class="src" style="font-style:normal">${fmtLon(A.B[r.id].lon)}, ${ord(A.B[r.id].house)} house</span></span><span class="act ${r.act}">${r.act}</span></h5>
          <ul class="why">${r.why.map((w) => `<li>${w}.</li>`).join('')}</ul>
          <div class="cols"><div>
            <div class="lbl">Timing</div><p>${timingText(A, r)}</p>
            ${days.length ? `<div class="lbl">Next suitable days</div><div class="days">${days.map((d) => `<span>${d}</span>`).join('')}</div>` : ''}
          </div><div>
            <div class="lbl">Correspondences of ${NA(r.via)} <span style="font-weight:400;letter-spacing:0;text-transform:none">(Agrippa ${ag.ch})</span></div>
            <table><tbody><tr><td>Day</td><td>${WEEKDAY[DAYNUM[r.via]]}</td></tr><tr><td>Metal</td><td>${ag.metal}</td></tr><tr><td>Colours</td><td>${ag.colour}</td></tr><tr><td>Stones</td><td>${ag.stones}</td></tr><tr><td>Table</td><td>${ag.square}</td></tr></tbody></table>
            ${S.herbs ? `<div class="lbl">Plants${r.herbs === r.id ? ', by sympathy' : `, by antipathy (${N(r.herbs)})`}</div><p>${cap(CULPEPER[r.herbs])}. Gathered, as Culpeper directs, in the hour of ${NA(r.herbs)}, with ${NA(r.herbs)} angular and the Moon applying to it by good aspect.</p>` : ''}
          </div></div>
          <div class="lbl">Way of life <span style="font-weight:400;letter-spacing:0;text-transform:none">(Ficino, De vita III)</span></div><p>${wayOfLife(r)}</p>
          <div class="future">Planned: the prayer and psalm for this ${r.act === 'none' ? 'planet' : 'action'}, from FEMT.</div></div>`; };
      page('remedies', 'Working with the chart', () => `${head('Working with the chart')}
        <p>Ptolemy defends astrology as useful because knowing what is coming lets us prepare for it, as a physician acts on a prognosis. The <i>Centiloquium</i> puts it more boldly: <i>sapiens dominabitur astris</i>, the wise one will rule the stars. This section suggests how to work with each planet according to its condition, using the five actions of FEMT's Celestial Alignment:</p>
        <div class="defs">${Object.entries(ACT_DEF).map(([k, v]) => `<span class="act ${k}">${k}</span><span>${cap(v)}.</span>`).join('')}</div>
        <h4>The planets in order of need</h4>
        <table><thead><tr><th></th><th>Planet</th><th class="r">Strength</th><th>Action</th><th>Through</th><th>Chiefly because</th></tr></thead><tbody>
          ${R.map((r) => `<tr><td class="c">${G(r.id)}</td><td>${N(r.id)}</td><td class="r">${A.P[r.id].total > 0 ? '+' : ''}${A.P[r.id].total}</td><td><span class="act ${r.act}">${r.act === 'none' ? 'leave be' : r.act}</span></td><td>${r.act === 'none' ? '' : `${G(r.via)} ${N(r.via)}`}</td><td>${r.why[0]}</td></tr>`).join('')}
        </tbody></table>
        <p style="margin-top:8px">Each planet that needs work has its own entry on the following pages: when to act (elections), the way of life that draws or tempers it (after Ficino), and its correspondences (after Agrippa)${S.herbs ? ' and plants (after Culpeper)' : ''}. Planets marked <i>leave be</i> are sound enough to need nothing.</p>
        ${S.herbs ? '<p class="src">The plants are traditional correspondences, given for understanding the chart. They are not medical advice: ask a qualified practitioner before taking any herb.</p>' : ''}
        ${cite('Ptolemy, Tetrabiblos I, "That it is also beneficial". Pseudo-Ptolemy, Centiloquium. The five actions follow FEMT\'s Celestial Alignment. Elections: Sahl ibn Bishr, On Elections; Ramesey, Astrologia Restaurata; Bonatti, Liber Astronomiae.')}`);
      // Pack the cards by measured height, as the print engine would paginate them.
      const measure = (h) => { const el = document.createElement('div'); el.className = cls; el.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;min-height:0'; el.innerHTML = h; document.body.appendChild(el); const v = el.offsetHeight; el.remove(); return v; };
      const remCite = () => cite('Ficino, De vita III; Agrippa, Three Books of Occult Philosophy I.23–29, I.49, II.22; Culpeper, The Complete Herbal. Full references under Method and sources.');
      const base = measure(head('Working with the chart, continued') + remCite()), budget = 842 - base - 4;
      const groups = []; let cur = [], used = 0;
      for (const r of acting) { const h = measure(card(r)) - 76 + 8; if (cur.length && used + h > budget) { groups.push(cur); cur = []; used = 0; } cur.push(r); used += h; }
      if (cur.length) groups.push(cur);
      groups.forEach((g, k) => page(`remedies${k + 1}`, `Working with the chart (${k + 2})`, () => `${head('Working with the chart, continued')}${g.map(card).join('')}${remCite()}`));
      if (false) page('', '', () => `${cite('Way of life: Ficino, De vita III.5, 11, 18, 21 and 22. Correspondences: Agrippa, Three Books of Occult Philosophy I.23–29 (metals, stones), I.49 (colours), II.22 (tables). Plants: Culpeper, The Complete Herbal, each herb\'s "Government and virtues"; sympathy and antipathy: "To the Reader", Instructions for the right use of the book, 4th and 5th; gathering: Directions, Section II, ch. 1, no. 5.')}`);
    }

    if (S.sec.sources) page('sources', 'Method and sources', () => `${head('Method and sources')}
      <p>This reading follows the traditional (Hellenistic, Persian, medieval and seventeenth-century English) method: seven planets, dignities, sect, the houses and their lords, lots and periods. The text is our own synthesis; the authors below are where the rules come from.</p>
      <h4>Primary sources</h4><ol class="refs">
        <li>Ptolemy, <i>Tetrabiblos</i>, tr. F. E. Robbins (Loeb, 1940) <span class="tag pd">PD in US</span> and tr. J. M. Ashmand (1822) <span class="tag pd">PD</span>.</li>
        <li>William Lilly, <i>Christian Astrology</i> (London, 1647) <span class="tag pd">PD</span>.</li>
        <li>William Ramesey, <i>Astrologia Restaurata</i> (1653), EEBO-TCP transcription <span class="tag cc0">CC0</span>.</li>
        <li>John Gadbury, <i>Genethlialogia</i> (1661) <span class="tag pd">PD</span>.</li>
        <li>Vettius Valens, <i>Anthologies</i>, ed. Kroll (1908) <span class="tag pd">PD</span>; tr. M. Riley (2010) <span class="tag chk">free, no licence</span>.</li>
        <li>Firmicus Maternus, <i>Mathesis</i>, ed. Kroll &amp; Skutsch (Teubner, 1897–1913) <span class="tag pd">PD</span>.</li>
        <li>Guido Bonatti, <i>Liber Astronomiae</i> (Augsburg, 1491) <span class="tag pd">PD</span>.</li>
        <li>Dorotheus of Sidon, <i>Carmen Astrologicum</i>, tr. Pingree (1976) <span class="tag ref">consulted, not quoted</span>.</li>
      </ol>
      <h4>Working with the chart</h4><ol class="refs">
        <li>Pseudo-Ptolemy, <i>Centiloquium</i> (Latin) <span class="tag pd">PD</span>. Sahl ibn Bishr, <i>On Elections</i> (Latin) <span class="tag pd">PD</span>.</li>
        <li>H. C. Agrippa, <i>Three Books of Occult Philosophy</i>, tr. J. F. (London, 1651), Book I ch. 23–29 and 49, Book II ch. 22 <span class="tag pd">PD</span>.</li>
        <li>Marsilio Ficino, <i>De vita libri tres</i> (Florence, 1489), Book III, ch. 5, 11, 18, 21, 22 <span class="tag pd">PD</span>, paraphrased; checked against the Source Library transcription and translation <span class="tag ref">CC BY-SA, not quoted</span>.</li>
        <li>Nicholas Culpeper, <i>Semeiotica Uranica</i> (1651), EEBO-TCP <span class="tag cc0">CC0</span>; <i>The Complete Herbal</i> (1653), Project Gutenberg #49513 <span class="tag pd">PD</span>.</li>
        <li><i>Picatrix</i> <span class="tag ref">consulted, not quoted</span>: all English translations are in copyright.</li>
      </ol>
      <h4>Data</h4><ol class="refs"><li>Planetary positions: JPL Keplerian elements (E. M. Standish) and Meeus, <i>Astronomical Algorithms</i> for the Moon, as in FEMT.</li><li>Fixed stars: Yale Bright Star Catalogue, 5th ed. <span class="tag pd">PD</span></li></ol>
      <h4>Settings used</h4><table><tbody><tr><td>Zodiac</td><td>Tropical</td></tr><tr><td>Houses</td><td>${S.houses === 'whole' ? 'Whole sign' : cap(S.houses)}</td></tr><tr><td>Triplicities</td><td>${S.trip === 'dorothean' ? 'Dorothean' : 'Ptolemaic (Lilly)'}</td></tr><tr><td>Terms</td><td>Egyptian</td></tr><tr><td>Faces</td><td>Chaldean</td></tr><tr><td>Modern planets</td><td>${S.modern === 'off' ? 'Left out' : 'Listed, not judged'}</td></tr><tr><td>Length of life and death</td><td>${S.omitDeath ? 'Left out' : 'Included'}</td></tr></tbody></table>`);
    return out;
  }

  // ---------- screens ----------
  function reportScreen(thumbs) {
    const A = analyse(PEOPLE[S.person]), P = pages(A);
    return `<div class="app"><div class="side">
      <h2>Natal reading</h2>
      <div class="seg"><button class="${thumbs ? '' : 'on'}" data-view="pages">Pages</button><button class="${thumbs ? 'on' : ''}" data-view="thumbs">Overview</button></div>
      <div class="toc">${P.map((pg, i) => `<button data-jump="${pg.id}"><span>${i + 1}</span>${pg.title}</button>`).join('')}</div>
      <div class="later"><b>Development path</b><ol><li><b>Natal reading</b> (this report)</li><li>Chart sheet</li><li>Transit forecast</li><li>Comparison</li></ol></div>
    </div>
    <div class="viewer${thumbs ? ' thumbs' : ''}" id="viewer">
      ${thumbs ? '' : `<div class="vhead"><span>${P.length} pages · A4 · ${S.style === 'clean' ? 'Clean' : 'Vellum'} style</span><span class="gen"><button class="btn primary" data-gen="pdf">Save PDF…</button><button class="btn" data-gen="docx">Save DOCX…</button></span></div>`}
      ${P.map((pg, i) => `<div class="pwrap" data-open="${pg.id}">${pg.html(i + 1, P.length)}</div>`).join('')}
    </div></div>`;
  }

  function builderScreen() {
    const chk = (k, l, d) => `<label><input type="checkbox" data-sec="${k}"${S.sec[k] ? ' checked' : ''}><span>${l}${d ? `<small>${d}</small>` : ''}</span></label>`;
    const opt = (v, l, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`;
    const A = analyse(PEOPLE[S.person]), P = pages(A);
    return `<div class="app"><div class="side">
      <h2>Report options</h2>
      <label class="field"><span>Chart</span><select data-k="person">${PEOPLE.map((q, i) => opt(i, q.name, S.person)).join('')}</select></label>
      <h3>Sections</h3><div class="checks">
        ${chk('cover', 'Cover', 'Logo, practice details, wheel')}${chk('glance', 'The nativity at a glance', 'Sect, chart ruler, strongest and weakest planet, lots')}
        ${chk('dignities', 'Essential and accidental dignity', 'Lilly\'s points, for all seven planets')}${chk('temperament', 'Temperament and the quality of the soul', 'Lilly\'s tally; Ptolemy on Mercury and the Moon')}
        ${chk('planets', 'The seven planets', 'About a page and a half of reading per two planets')}${chk('houses', 'The twelve houses', 'Each house by its cusp, lord and occupants')}
        ${chk('lots', 'Lots and fixed stars')}${chk('timing', 'Timing: profections and firdaria')}${chk('remedies', 'Working with the chart', 'Magnify, strengthen, neutralize, restrain, settle')}${chk('sources', 'Method and sources')}</div>
      <div class="checks"><label><input type="checkbox" data-k="herbs"${S.herbs ? ' checked' : ''}><span>Include plants (Culpeper)<small>With a not-medical-advice note</small></span></label></div>
      <h3>Method</h3>
      <label class="field"><span>Houses</span><select data-k="houses">${opt('whole', 'Whole sign (Hellenistic)', S.houses)}${opt('porphyry', 'Porphyry', S.houses)}${opt('placidus', 'Placidus', S.houses)}${opt('equal', 'Equal', S.houses)}<option disabled>Regiomontanus (Lilly) — to add</option><option disabled>Alcabitius — to add</option></select></label>
      <label class="field"><span>Triplicity rulers</span><select data-k="trip">${opt('dorothean', 'Dorothean (day, night, partner)', S.trip)}${opt('ptolemaic', 'Ptolemaic (as Lilly)', S.trip)}</select></label>
      <label class="field"><span>Uranus, Neptune, Pluto</span><select data-k="modern">${opt('listed', 'List them, don\'t judge them', S.modern)}${opt('off', 'Leave them out', S.modern)}</select></label>
      <div class="checks"><label><input type="checkbox" data-k="omitDeath"${S.omitDeath ? ' checked' : ''}><span>Leave out length of life and death<small>Hyleg, alcocoden and the 8th-house judgments of death</small></span></label>
      <label><input type="checkbox" data-k="cite"${S.cite ? ' checked' : ''}><span>Cite sources under each section</span></label></div>
      <h3>Look</h3>
      <label class="field"><span>Style</span><select data-k="style">${opt('vellum', 'Vellum', S.style)}${opt('clean', 'Clean', S.style)}</select></label>
      <button class="btn primary" data-s="report">Preview the ${P.length} pages</button>
      <div class="later"><b>Later report types:</b> Chart sheet, Transit forecast and Comparison appear here as they're built.</div>
    </div>
    <div class="viewer thumbs">${P.map((pg, i) => `<div class="pwrap" data-open="${pg.id}">${pg.html(i + 1, P.length)}</div>`).join('')}</div></div>`;
  }

  function settingsScreen() {
    const A = analyse(PEOPLE[S.person]), P = pages(A);
    const cover = P.find((p) => p.id === 'cover'), inner = P.find((p) => p.id !== 'cover');
    return `<div class="app"><div class="side">
      <h2>Settings · Reports</h2>
      <h3>Logo</h3>
      <div class="logo-drop"><div class="thumb">${S.logo ? `<img src="${S.logo}" alt="">` : '<span style="color:#999;font-size:11px">None</span>'}</div>
        <div><div class="txt">PNG, JPG or SVG. Printed in the upper left of the report. Kept in %APPDATA%\\pagbalatik\\branding.</div>
        <div class="acts"><label class="btn">Choose image…<input type="file" accept="image/png,image/jpeg,image/svg+xml" id="logo-file" hidden></label>${S.logo ? '<button class="btn" data-k2="nologo">Remove</button>' : ''}${S.logo !== SAMPLE_LOGO ? '<button class="btn" data-k2="sample">Sample</button>' : ''}</div></div></div>
      <label class="field"><span>Show the logo on</span><select data-k="logoWhere"><option value="all"${S.logoWhere === 'all' ? ' selected' : ''}>The cover and every page header</option><option value="cover"${S.logoWhere === 'cover' ? ' selected' : ''}>The cover only</option></select></label>
      <label class="field"><span>Logo height in the header: ${S.logoSize} pt (cover: ${Math.round(S.logoSize * 1.7)} pt)</span><input type="range" min="20" max="56" value="${S.logoSize}" data-k="logoSize"></label>
      <h3>Beside the logo, on the cover</h3>
      <label class="field"><span>Practice or reader's name</span><input type="text" value="${esc(S.practice)}" data-k="practice"></label>
      <label class="field"><span>Contact lines</span><textarea data-k="contact">${esc(S.contact)}</textarea></label>
      <p class="txt" style="font-size:12px;color:var(--text-faint);margin:0">The name also goes in each page's footer. Leave both empty for a plain cover.</p>
    </div>
    <div class="viewer">${cover ? `<div class="pwrap">${cover.html(1, P.length)}</div>` : ''}${inner ? `<div class="pwrap">${inner.html(2, P.length)}</div>` : ''}</div></div>`;
  }

  // ---------- wiring ----------
  function render(keepScroll) {
    const v = $('viewer'), top = v ? v.scrollTop : 0;
    $('main').innerHTML = S.screen === 'report' ? reportScreen(S.view === 'thumbs') : S.screen === 'builder' ? builderScreen() : settingsScreen();
    document.querySelectorAll('#mk-screens button').forEach((b) => b.classList.toggle('on', b.dataset.s === S.screen));
    $('mk-person').value = S.person;
    if (keepScroll && $('viewer')) $('viewer').scrollTop = top;
    const f = $('logo-file');
    if (f) f.addEventListener('change', () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { S.logo = r.result; render(); }; r.readAsDataURL(file); });
  }
  $('mk-person').innerHTML = PEOPLE.map((q, i) => `<option value="${i}">${esc(q.name)}</option>`).join('');
  $('mk-person').addEventListener('change', (e) => { S.person = +e.target.value; render(); });
  const jump = (id) => { const el = document.querySelector(`#viewer [data-page="${id}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, .pwrap'); if (!t) return;
    const d = t.dataset;
    if (d.s) { S.screen = d.s; S.view = 'pages'; return render(); }
    if (d.view) { S.view = d.view; return render(); }
    if (d.jump) { if (S.view === 'thumbs') { S.view = 'pages'; render(); } return jump(d.jump); }
    if (d.open && (S.screen === 'builder' || S.view === 'thumbs')) { S.screen = 'report'; S.view = 'pages'; render(); return setTimeout(() => jump(d.open), 30); }
    if (d.k2 === 'nologo') { S.logo = null; return render(); }
    if (d.k2 === 'sample') { S.logo = SAMPLE_LOGO; return render(); }
    if (d.gen) alert(`In the app: asks where to save "Natal reading - ${PEOPLE[S.person].name}.${d.gen}", then opens it.`);
  });
  const onField = (e) => {
    const el = e.target, d = el.dataset;
    if (d.sec) S.sec[d.sec] = el.checked;
    else if (d.k === 'person') S.person = +el.value;
    else if (d.k === 'logoSize') S.logoSize = +el.value;
    else if (['omitDeath', 'cite', 'herbs'].includes(d.k)) S[d.k] = el.checked;
    else if (d.k) S[d.k] = el.value;
    else return;
    if (e.type === 'input' && (d.k === 'practice' || d.k === 'contact')) { // update previews without losing focus
      const v = $('viewer'); const A = analyse(PEOPLE[S.person]), P = pages(A); const c = P.find((p) => p.id === 'cover'), i = P.find((p) => p.id !== 'cover');
      v.innerHTML = `${c ? `<div class="pwrap">${c.html(1, P.length)}</div>` : ''}${i ? `<div class="pwrap">${i.html(2, P.length)}</div>` : ''}`; return;
    }
    render(true);
  };
  document.addEventListener('change', (e) => { if (e.target.id !== 'mk-person' && e.target.id !== 'logo-file' && !['practice', 'contact'].includes(e.target.dataset.k)) onField(e); });
  document.addEventListener('input', (e) => { if (['practice', 'contact', 'logoSize'].includes(e.target.dataset.k)) { if (e.target.dataset.k === 'logoSize') { S.logoSize = +e.target.value; const lbl = e.target.previousElementSibling; if (lbl) lbl.textContent = `Logo height in the header: ${S.logoSize} pt (cover: ${Math.round(S.logoSize * 1.7)} pt)`; const v = $('viewer'); const A = analyse(PEOPLE[S.person]), P = pages(A); const c = P.find((p) => p.id === 'cover'), i = P.find((p) => p.id !== 'cover'); v.innerHTML = `${c ? `<div class="pwrap">${c.html(1, P.length)}</div>` : ''}${i ? `<div class="pwrap">${i.html(2, P.length)}</div>` : ''}`; } else onField(e); } });
  render();
})();
</script>
</body>
</html>
